<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — DPS Noida MUN Club</title>
    <meta name="description" content="Photo gallery of the DPS Noida MUN Club's conferences and victories.">
    <link rel="stylesheet" href="styles.css">
    <style>
        .page-header {
            padding: 130px 2rem 60px 2rem;
            text-align: center;
            background: linear-gradient(170deg, #fff 0%, var(--dps-green-pale) 50%, #fff 100%);
        }

        .page-header h1 {
            font-family: var(--font-display);
            font-size: 3rem;
            font-weight: 700;
            color: var(--dps-green);
        }

        .page-header p {
            color: var(--text-muted);
            font-style: italic;
            margin-top: 0.5rem;
        }

        /* MASONRY */
        .gallery-masonry {
            columns: 3;
            column-gap: 1.25rem;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 1.25rem;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1px solid var(--border-light);
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            background: var(--bg-white);
        }

        .gallery-item:hover {
            border-color: var(--dps-green);
            box-shadow: var(--shadow-md);
            transform: translateY(-3px);
        }

        .gallery-item img {
            width: 100%;
            display: block;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.04);
        }

        .gallery-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 104, 55, 0.8) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            align-items: flex-end;
            padding: 1.25rem;
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .gallery-overlay span {
            color: #fff;
            font-size: 0.88rem;
            font-weight: 500;
        }

        /* LIGHTBOX */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
            animation: lightboxIn 0.3s ease;
        }

        @keyframes lightboxIn {
            from {
                transform: scale(0.92);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .lightbox-caption {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 0.95rem;
            background: rgba(0, 104, 55, 0.8);
            padding: 10px 28px;
            border-radius: 50px;
        }

        .lightbox-close {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transition: var(--transition);
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        @media (max-width: 768px) {
            .page-header {
                padding: 100px 1rem 40px 1rem;
            }

            .page-header h1 {
                font-size: 2rem;
            }

            .page-header p {
                font-size: 0.85rem;
            }

            .gallery-masonry {
                columns: 2;
                column-gap: 0.75rem;
            }

            .gallery-item {
                margin-bottom: 0.75rem;
                border-radius: 10px;
            }

            .gallery-overlay span {
                font-size: 0.75rem;
            }

            .lightbox img {
                max-width: 95%;
                max-height: 80vh;
                border-radius: 8px;
            }

            .lightbox-caption {
                font-size: 0.8rem;
                padding: 8px 20px;
                bottom: 1.5rem;
            }

            .lightbox-close {
                top: 1rem;
                right: 1rem;
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .page-header {
                padding: 90px 0.75rem 30px 0.75rem;
            }

            .page-header h1 {
                font-size: 1.6rem;
            }

            .gallery-masonry {
                columns: 1;
                column-gap: 0;
            }

            .gallery-item {
                margin-bottom: 0.75rem;
            }

            .gallery-overlay {
                opacity: 1;
                background: linear-gradient(to top, rgba(0, 104, 55, 0.6) 0%, transparent 40%);
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="MUN_Logo.jpeg" alt="Logo"> DPSN MUN
            </a>
            <div class="menu-toggle" onclick="toggleMenu()">&#9776;</div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="members.html">Secretariat</a></li>
                <li><a href="victories.html">Victories</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="resources.html">Resources</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-header">
        <h1>Club Gallery</h1>
        <p>Moments that define us</p>
    </div>

    <section class="section" style="padding-top: 40px;">
        <div class="gallery-masonry" id="gallery-root"></div>
    </section>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <div class="lightbox-close">&times;</div>
        <img id="lightbox-img" src="" alt="">
        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-logo">DPSN MUN Club</div>
            <div class="footer-tagline">May the Force be with Us</div>
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="members.html">Secretariat</a>
                <a href="victories.html">Victories</a>
                <a href="gallery.html">Gallery</a>
                <a href="resources.html">Resources</a>
            </div>
            <div class="footer-copy">&copy; 2025 DPS Noida MUN Club. All rights reserved.</div>
        </div>
    </footer>

    <script>
        function toggleMenu() { document.getElementById('navLinks').classList.toggle('active'); }

        const photosDatabase = [
            { url: "ZESTE25_MUN.jpeg", alt: "Victory at Zeste MUN 2025" },
            { url: "Mayoor_MUN.jpeg", alt: "Best Delegation at Mayoor MUN 2025" },
            { url: "Columban24.jpeg", alt: "Best Delegation at Columban MUN 2024" },
            { url: "Zeste24.jpg", alt: "Good Performance at Zeste MUN 2024" },
            { url: "Novices23.jpg", alt: "Winning at Novices MUN 2023" },
            { url: "Columban23.jpg", alt: "Best Delegation at Columban MUN 2023" },
            { url: "MRIS_MUN23.jpg", alt: "Top Delegation at MRIS MUN 2023" },
            { url: "PHOTO-2023-08-07-11-50-16.jpg", alt: "Rolling Trophy at Columban 2023" },
            { url: "PHOTO-2025-05-17-21-51-23.jpg", alt: "Club Photo at Mayoor MUN 2025" },
            { url: "IMG_1726.jpeg", alt: "Mock MUN 2025 Summer Edition" },
            { url: "IMG_4637.JPEG", alt: "Mayoor MUN 2025" },
            { url: "PHOTO-2024-08-12-20-12-38.jpg", alt: "Columban MUN 2024" }
        ];

        const galleryRoot = document.getElementById('gallery-root');
        photosDatabase.forEach((p, i) => {
            const item = document.createElement('div');
            item.className = 'gallery-item reveal';
            item.style.transitionDelay = (i * 0.05) + 's';
            item.innerHTML = `
                <img src="${p.url}" alt="${p.alt}" loading="lazy">
                <div class="gallery-overlay"><span>${p.alt}</span></div>`;
            item.onclick = () => openLightbox(p.url, p.alt);
            galleryRoot.appendChild(item);
        });

        function openLightbox(url, caption) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-caption').textContent = caption;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>

</html>
