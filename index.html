<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - DPS Noida MUN Club</title>
    <style>
        /* SHARED CSS (Copy this logic to all files) */
        :root { --dps-green: #006837; --accent: #c0392b; --bg-light: #f9f9f9; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg-light); color: #333; }
        nav { background: #222; padding: 1rem; text-align: center; }
        nav a { color: #fff; text-decoration: none; margin: 0 15px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        nav a:hover, nav a.active { color: #4CAF50; }
        header { background: #fff; padding: 50px 20px; text-align: center; border-bottom: 5px solid var(--dps-green); }
        .logo-placeholder { width: 120px; height: 120px; background: #eee; border-radius: 50%; display: inline-block; object-fit: cover; margin-bottom: 15px; }
        h1 { color: var(--dps-green); margin: 10px 0; font-family: 'Georgia', serif; }
        section { padding: 40px 20px; max-width: 800px; margin: 0 auto; text-align: center; }
        
        /* NEWS BOX STYLE */
        .news-box { background: #fff; border-left: 5px solid var(--accent); padding: 20px; margin-bottom: 20px; text-align: left; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .news-date { color: var(--accent); font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
        .news-content { font-size: 1.1rem; margin-top: 5px; }

        /* ARCHIVE BUTTONS */
        .archive-card { background: #fff; padding: 15px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #ddd; }
        .archive-link { color: var(--dps-green); text-decoration: none; font-weight: bold; }
        footer { text-align: center; padding: 40px; background: #222; color: #777; margin-top: 50px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="members.html">Secretariat</a>
        <a href="victories.html">Victories</a>
        <a href="gallery.html">Gallery</a>
    </nav>

    <header>
        <img src="MUN_Logo.jpeg" alt="DPS Logo" class="logo-placeholder">
        <h1>MUN Club of DPS Noida</h1>
        <p style="color: #666; font-style: italic;">May the Force be with Us</p>
    </header>

    <section>
        <h2 style="color: #444;">Latest Updates</h2>
        <div id="news-root"></div>
    </section>

    <section style="background: #eaeaea; max-width: 100%;">
        <h2 style="color: #444;">Archives & Resources</h2>
        <div id="archives-root"></div>
    </section>

    <footer>&copy; 2025 DPS Noida MUN Club.</footer>

    <script>
        // NEWS DATA
        const newsDatabase = [
            { date: "Aug 15, 2025", text: "Registrations are now open for the Summer Intra-School Mock MUN Conference!" },
            { date: "July 20, 2025", text: "DPS Noida wins runners-up School Delegation at RIS Zeste MV MUN 2025!" },
            { date: "May 19, 2025", text: "DPS Noida wins Best School Delegation at Mayoor MUN 2025" }
        ];
        // ARCHIVES DATA
        const archivesDatabase = [
            { year: "2024", title: "DPS MUN 2015 Official Site", url: "https://mrigankswork.github.io/dpsnmun.github.io/details.html" },
            { year: "2023", title: "DPSN MUN Club 2010 Site", url: "https://dpsnmun.weebly.com/index.html" }
        ];

        // RENDER
        const newsRoot = document.getElementById('news-root');
        newsDatabase.forEach(item => {
            newsRoot.innerHTML += `<div class="news-box"><div class="news-date">${item.date}</div><div class="news-content">${item.text}</div></div>`;
        });
        const archivesRoot = document.getElementById('archives-root');
        archivesDatabase.forEach(item => {
            archivesRoot.innerHTML += `<div class="archive-card"><strong>${item.year}:</strong> <a href="${item.url}" class="archive-link">${item.title}</a></div>`;
        });
    </script>
</body>
</html>
